version: '3.8'

# Producción: definir SECRET_KEY y contraseñas reales (no usar defaults)
# Opción 1: export POSTGRES_PASSWORD=... SECRET_KEY=... y ejecutar
# Opción 2: crear .env.prod desde env.example y: docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - DEBUG=False
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-cambiar-en-produccion-clave-segura-32-chars-minimo}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/document_extractor
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - PORT=8005
      - HOST=0.0.0.0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=document_extractor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis para cache y colas
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: rq worker document_processing --url redis://redis:6379
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-cambiar-en-produccion-clave-segura-32-chars-minimo}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/document_extractor
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend (opcional: incluir con profile 'frontend')
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=
    ports:
      - "3001:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - frontend

  # Nginx reverse proxy (API en :80; con profile frontend usar nginx que sirva SPA + proxy /api)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
